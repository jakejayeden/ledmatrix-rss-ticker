name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate Python syntax
        run: python -m py_compile manager.py
      - name: Validate JSON files
        run: |
          python -m json.tool manifest.json >/dev/null
          python -m json.tool config_schema.json >/dev/null
          python -m json.tool example_config.json >/dev/null
